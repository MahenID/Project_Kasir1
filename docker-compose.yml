services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kasir-backend
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "DragonMart POS"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,127.0.0.1:3000,localhost:8000
      SESSION_DOMAIN: localhost
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: kasir_db
      DB_USERNAME: kasir_user
      DB_PASSWORD: kasir_password
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "if [ ! -f .env ]; then cp .env.example .env; fi &&
      php artisan key:generate --force &&
      php artisan migrate --force &&
      php artisan storage:link &&
      php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kasir-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api
    volumes:
      - ./frontend:/app
      - frontend-node_modules:/app/node_modules
    depends_on:
      - backend
    command: >
      sh -c "npm install &&
      npm run dev -- --hostname 0.0.0.0 --port 3000"

  mysql:
    image: docker.io/library/mysql:8.4
    container_name: kasir-mysql
    environment:
      MYSQL_DATABASE: kasir_db
      MYSQL_USER: kasir_user
      MYSQL_PASSWORD: kasir_password
      MYSQL_ROOT_PASSWORD: kasir_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u kasir_user -pkasir_password"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: kasir-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kasir-queue-worker
    working_dir: /var/www/html
    environment:
      APP_NAME: "DragonMart POS"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,127.0.0.1:3000,localhost:8000
      SESSION_DOMAIN: localhost
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: kasir_db
      DB_USERNAME: kasir_user
      DB_PASSWORD: kasir_password
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: php artisan queue:work redis --queue=default --verbose --tries=3

volumes:
  frontend-node_modules:
  mysql-data:
  redis-data:
